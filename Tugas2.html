<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            background-color: #eee9f7;
            font-family: Arial, sans-serif;
            color: #55516b;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #d6cbed;
        }

        .header {
            background-color: #c9b8e8;
            padding: 22px;
            text-align: center;
            border-bottom: 1px solid #b7a2dc;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            color: #44365f;
        }

        .form-body {
            padding: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px 25px;
        }

        .field {
            min-width: 0;
        }

        .full {
            grid-column: 1 / -1;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: #8065a6;
            font-size: 16px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d2c8e4;
            border-radius: 6px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            background-color: #fcfaff;
            color: #55516b;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #c9b8e8;
            border-color: #a58bcf;
        }

        .choices {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            min-height: 25px;
        }

        .choices label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin: 0;
            color: #625a73;
            font-weight: normal;
            font-size: 15px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            accent-color: #8d72bd;
        }

        .income-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex: 1;
            min-width: 0;
            accent-color: #8d72bd;
        }

        output {
            background-color: #8d72bd;
            color: white;
            padding: 9px 12px;
            border-radius: 6px;
            min-width: 60px;
            text-align: center;
        }

        .file-row input {
            max-width: 100%;
            font-size: 14px;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        .footer {
            display: flex;
            justify-content: flex-end;
            padding-top: 20px;
        }

        button {
            background-color: #8d72bd;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #72559f;
        }

        @media (max-width: 600px) {
            .form-body {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .full {
                grid-column: auto;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Create Account</h1>
    </div>

    <form class="form-body" id="accountForm">

        <div class="form-grid">

            <div class="field">
                <label for="firstName">First name *</label>
                <input type="text" id="firstName"
                       placeholder="enter your first name" required>
            </div>

            <div class="field">
                <label for="lastName">Last name</label>
                <input type="text" id="lastName"
                       placeholder="enter your last name">
            </div>

            <div class="field full">
                <label for="email">Email *</label>
                <input type="email" id="email"
                       placeholder="enter your email" required>
            </div>

            <div class="field">
                <label for="password">Password *</label>
                <input type="password" id="password"
                       placeholder="enter your password" required>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm Password *</label>
                <input type="password" id="confirmPassword"
                       placeholder="enter your password again" required>
            </div>

            <div class="field">
                <label>Gender:</label>
                <div class="choices">
                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>
                </div>
            </div>

            <div class="field">
                <label>Hobbies</label>
                <div class="choices">
                    <label>
                        <input type="checkbox" name="hobbies" value="Music">
                        Music
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Sports">
                        Sports
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Travel">
                        Travel
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Movies">
                        Movies
                    </label>
                </div>
            </div>

            <div class="field">
                <label for="incomeSource">Source of Income</label>
                <select id="incomeSource">
                    <option>Employed</option>
                    <option>Self-employed</option>
                    <option>Student</option>
                    <option>Unemployed</option>
                </select>
            </div>

            <div class="field">
                <label for="income">Income *</label>
                <div class="income-row">
                    <input type="range" id="income"
                           min="0" max="100" value="20">
                    <output id="incomeValue">20K</output>
                </div>
            </div>

            <div class="field file-row">
                <label for="photo">Upload Profile Picture</label>
                <input type="file" id="photo" accept="image/*">
            </div>

            <div class="field">
                <label for="age">Age *</label>
                <input type="number" id="age"
                       value="18" min="1" max="120" required>
            </div>

            <div class="field full">
                <label for="bio">Bio</label>
                <textarea id="bio"
                          placeholder="write something about yourself..."></textarea>
            </div>

        </div>

        <div class="footer">
            <button type="submit">Create</button>
        </div>

    </form>

</div>

<script>
    const income = document.getElementById("income");
    const incomeValue = document.getElementById("incomeValue");
    const accountForm = document.getElementById("accountForm");

    income.addEventListener("input", function () {
        incomeValue.textContent = income.value + "K";
    });

    accountForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            alert("Password dan Confirm Password harus sama!");
            return;
        }

        alert("Account berhasil dibuat!");
    });
</script>

</body>
</html>
